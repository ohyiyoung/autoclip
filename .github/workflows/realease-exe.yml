name: Build Windows exe

# Dijalankan saat kamu push tag versi (mis. v0.1.0) atau manual dari tab Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # dibutuhkan untuk membuat Release dan melampirkan zip

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.11: MediaPipe tidak punya wheel untuk 3.13 (lihat README).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Non-editable: data (static UI, font, prompt) harus ikut terpasang di site-packages.
      - name: Install AutoClip and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pywebview pyinstaller

      - name: Build exe
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --name AutoClipDesktop \
            --collect-all autoclip \
            --collect-all mediapipe \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all scenedetect \
            --collect-all pysubs2 \
            --collect-all webview \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import keyring.backends.Windows \
            launcher/autoclip_desktop.py

      # Gagal lebih awal kalau UI tidak terbundel (build "sukses" tapi layar kosong).
      - name: Verify bundle contents
        shell: bash
        run: |
          test -f dist/AutoClipDesktop/AutoClipDesktop.exe
          find dist/AutoClipDesktop -path "*autoclip/static/index.html" | grep -q . \
            || { echo "UI (static/index.html) tidak ikut terbundel"; exit 1; }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/AutoClipDesktop -DestinationPath AutoClipDesktop-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClipDesktop-windows
          path: AutoClipDesktop-windows.zip
          retention-days: 14

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AutoClipDesktop-windows.zip
          generate_release_notes: true
          body: |
            Ekstrak zip, jalankan `AutoClipDesktop.exe`.
            Butuh ffmpeg build lengkap: `winget install Gyan.FFmpeg`.
